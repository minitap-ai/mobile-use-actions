name: Test actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse action manifests
        run: >-
          ruby -e 'require "yaml"; Dir[".github/actions/*/action.yml"].each { |file| YAML.safe_load(File.read(file), aliases: true) }'
      - name: Test vulnerability scanner
        run: python3 .github/actions/gcp-container-vulnerability-scan/test_scan.py
      - name: Compile vulnerability scanner
        run: python3 -m py_compile .github/actions/gcp-container-vulnerability-scan/scan.py
